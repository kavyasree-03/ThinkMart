<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Think Mart · Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <!-- NAVIGATION -->
  <nav>
    <div class="nav-logo">
      <a href="Home-Page.html"><i class="fas fa-store"></i> Think<span>Mart</span></a>
    </div>
    <ul class="nav-links">
      <li><a href="Home-Page.html">Home</a></li>
      <li><a href="Products.html">Products</a></li>
      <li><a href="About.html">About</a></li>
      <li><a href="Contact.html">Contact</a></li>
      <li><a href="Cart.html">Cart</a></li>
    </ul>
    <div class="nav-icons">
      <a href="index.html" title="Login"><i class="fas fa-user-circle"></i></a>
      <a href="Cart.html" title="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge">0</span>
      </a>
    </div>
  </nav>

  <!-- LOGIN FORM -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Login to your Think Mart account</p>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="Register-Page.html">Register</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('thinkmart_user', data.data || email);
          alert('Login successful! ✅');
          window.location.href = 'Home-Page.html';
        } else {
          alert('❌ ' + data.message);
        }
      } catch (err) {
        alert('Server error. Is Spring Boot running?');
        console.error(err);
      }
    });
  </script>
  <script src="scripts/cart.js"></script>
</body>
</html>
