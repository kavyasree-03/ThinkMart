<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Think Mart · Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <nav>
    <div class="nav-logo">
      <a href="Home-Page.html"><i class="fas fa-store"></i> Think<span>Mart</span></a>
    </div>
    <ul class="nav-links">
      <li><a href="Home-Page.html">Home</a></li>
      <li><a href="Products.html">Products</a></li>
      <li><a href="About.html">About</a></li>
      <li><a href="Contact.html">Contact</a></li>
      <li><a href="Cart.html">Cart</a></li>
    </ul>
    <div class="nav-icons">
      <a href="index.html" title="Login"><i class="fas fa-user-circle"></i></a>
      <a href="Cart.html" title="Cart">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge">0</span>
      </a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Create Account ✨</h2>
      <p class="subtitle">Join Think Mart and start shopping</p>

      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Create a strong password" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="regConfirm" placeholder="Re-enter password" required>
        </div>
        <button type="submit" class="btn-primary">Register</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="index.html">Login</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirm').value;

      if (password !== confirmPassword) {
        alert('❌ Passwords do not match');
        return;
      }

      try {
        const res = await fetch('/api/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, confirmPassword })
        });
        const data = await res.json();

        if (data.success) {
          alert('Registration successful! ✅ Please login.');
          window.location.href = 'index.html';
        } else {
          alert('❌ ' + data.message);
        }
      } catch (err) {
        alert('Server error. Is Spring Boot running?');
        console.error(err);
      }
    });
  </script>
  <script src="scripts/cart.js"></script>
</body>
</html>
