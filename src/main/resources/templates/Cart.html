<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ThinkMart | Cart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-shell container cart-page">
    <section class="section-header cart-header">
        <div>
            <p class="eyebrow">Your selection</p>
            <h1>Shopping Cart</h1>
        </div>
    </section>

    <div th:if="${successMessage != null}" class="alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage != null}" class="alert error" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(items)}" class="empty-state panel">
        <h3>Your cart is empty.</h3>
        <p>Browse our products and add items to continue shopping.</p>
        <a th:href="@{/products}" class="primary-btn">Continue Shopping</a>
    </div>

    <div th:unless="${#lists.isEmpty(items)}" class="cart-layout">
        <div class="cart-items panel">
            <div class="cart-item" th:each="item : ${items}">
                <img th:src="${item.imageUrl}" th:alt="${item.productName}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=900&q=80';">
                <div class="cart-details">
                    <h3 th:text="${item.productName}"></h3>
                    <div class="cart-price" th:text="${#numbers.formatCurrency(item.unitPrice)}"></div>

                    <div class="qty-adjuster">
                        <form th:action="@{/cart/update/{productId}(productId=${item.productId})}" method="post" class="inline-form">
                            <button type="submit" name="quantity" class="qty-btn" th:value="${item.quantity - 1}" th:disabled="${item.quantity <= 1}">−</button>
                            <span class="qty-value" th:text="${item.quantity}"></span>
                            <button type="submit" name="quantity" class="qty-btn" th:value="${item.quantity + 1}">+</button>
                        </form>

                        <form th:action="@{/cart/remove/{productId}(productId=${item.productId})}" method="post" class="inline-form remove-form">
                            <button type="submit" class="text-btn">Remove</button>
                        </form>
                    </div>
                </div>
                <div class="item-subtotal" th:text="${#numbers.formatCurrency(item.subtotal)}"></div>
            </div>
        </div>

        <aside class="cart-summary panel">
            <h3>Order Summary</h3>
            <div class="summary-row">
                <span>Total Quantity</span>
                <strong th:text="${totalQuantity}"></strong>
            </div>
            <div class="summary-row">
                <span>Subtotal</span>
                <strong th:text="${#numbers.formatCurrency(subtotal)}"></strong>
            </div>
            <div class="summary-row total-row">
                <span>Order Total</span>
                <strong th:text="${#numbers.formatCurrency(orderTotal)}"></strong>
            </div>
            <a th:href="@{/products}" class="secondary-btn">Continue Shopping</a>
            <a th:href="@{/checkout}" class="primary-btn btn-block">Proceed to Checkout</a>
        </aside>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
