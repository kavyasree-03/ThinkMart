<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ThinkMart | Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-shell container checkout-page">
    <section class="section-header">
        <div>
            <p class="eyebrow">Demo checkout</p>
            <h1>Secure your order</h1>
        </div>
    </section>

    <div th:if="${errorMessage != null}" class="alert error" th:text="${errorMessage}"></div>

    <div class="checkout-layout">
        <section class="panel order-summary-panel">
            <h2>Order Summary</h2>
            <div class="mini-cart-item" th:each="item : ${items}">
                <div>
                    <strong th:text="${item.productName}"></strong>
                    <small th:text="${'Qty: ' + item.quantity}"></small>
                </div>
                <span th:text="${#numbers.formatCurrency(item.subtotal)}"></span>
            </div>
            <div class="summary-total">
                <span>Total</span>
                <strong th:text="${#numbers.formatCurrency(subtotal)}"></strong>
            </div>
        </section>

        <section class="panel checkout-form-panel">
            <h2>Customer Details</h2>
            <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post" class="checkout-form">
                <div class="form-group">
                    <label for="customerName">Full name</label>
                    <input id="customerName" type="text" th:field="*{customerName}" placeholder="Jane Smith">
                    <small class="error-message" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></small>
                </div>

                <div class="form-group">
                    <label for="customerEmail">Email address</label>
                    <input id="customerEmail" type="email" th:field="*{customerEmail}" placeholder="jane@email.com">
                    <small class="error-message" th:if="${#fields.hasErrors('customerEmail')}" th:errors="*{customerEmail}"></small>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone number</label>
                    <input id="phoneNumber" type="text" th:field="*{phoneNumber}" placeholder="+1 555 010 2020">
                    <small class="error-message" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></small>
                </div>

                <div class="form-group">
                    <label for="deliveryAddress">Delivery address</label>
                    <textarea id="deliveryAddress" rows="4" th:field="*{deliveryAddress}" placeholder="123 Sample Street, Demo City"></textarea>
                    <small class="error-message" th:if="${#fields.hasErrors('deliveryAddress')}" th:errors="*{deliveryAddress}"></small>
                </div>

                <div class="checkout-footer">
                    <strong>Total Due: <span th:text="${#numbers.formatCurrency(subtotal)}"></span></strong>
                    <button type="submit" class="primary-btn">Place Order</button>
                </div>
            </form>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
