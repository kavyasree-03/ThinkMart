spring.application.name=ThinkMart
server.port=8080

# Default to MySQL if DB_URL is set; otherwise use H2 for local/demo execution.
spring.datasource.url=${DB_URL:jdbc:h2:mem:thinkmart_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true

# Optional H2 console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
